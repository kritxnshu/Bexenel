<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEXENEL — Something is Coming</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic ambient interactive background -->
  <canvas id="ambient-canvas"></canvas>
  <div class="spotlight" id="spotlight"></div>

  <!-- Page Layout -->
  <div class="layout">
    
    <!-- Top announcement -->
    <header class="top-section">
      <div class="pill-badge">
        <span class="status-dot"></span>
        <span class="teaser-text">Hello world, something is coming</span>
      </div>
    </header>

    <!-- Center brand title -->
    <main class="center-section">
      <div class="brand-wrapper">
        <h1 class="brand-title" data-text="BEXENEL">BEXENEL</h1>
        <div class="brand-reflection" aria-hidden="true">BEXENEL</div>
      </div>
      <p class="tagline">The future is taking shape.</p>
    </main>

    <!-- Bottom credit -->
    <footer class="bottom-section">
      <div class="credit">
        <span class="credit-label">Crafted</span>
        <span class="credit-author">By K</span>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
